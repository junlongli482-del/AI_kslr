name: quick-entry
services:
  postgres:
    container_name: quick-entry-postgres
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: quickentry
      POSTGRES_USER: quickentry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - quick-entry-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickentry -d quickentry"]
      interval: 5s
      retries: 12
volumes:
  quick-entry-db:
    name: quick-entry-postgres
